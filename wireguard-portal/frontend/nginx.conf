limit_req_zone $binary_remote_addr zone=portal:10m rate=10r/s;
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    location = /api/admin/restore {
        client_max_body_size 32m;
        limit_req zone=portal burst=3 nodelay;
        proxy_set_header Host $http_host;
        proxy_set_header X-Portal-Client $remote_addr;
        proxy_pass http://api:8000;
    }
    location /api/ {
        limit_req zone=portal burst=40 nodelay;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Portal-Client $remote_addr;
        proxy_pass http://api:8000;
        proxy_buffering off;
    }
    location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}
